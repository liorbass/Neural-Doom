[project]
name = "neural-doom"
version = "0.1.0"
description = "Can a neural network learn to be a CPU? Ultra-fast Mamba SSM basic block prediction and 3-tier optimization pipeline running DOOM in real time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "neural-doom contributors" },
]
keywords = [
    "mamba",
    "ssm",
    "rv32i",
    "risc-v",
    "doom",
    "cpu-emulation",
    "machine-learning",
    "webassembly",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2",
    "torch>=2.4",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true
# torch ships incomplete stubs; we treat it as Any and keep the rest strict
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["torch.*", "matplotlib.*"]
ignore_missing_imports = true
follow_imports = "skip"
